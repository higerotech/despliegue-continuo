# Inventario de aplicaciones desplegables.
#
# Esta lista ES la allowlist: un webhook de un repo que no aparezca aqui se
# ignora. Copiala a /etc/cd-receiver/apps.yml en el servidor y recarga con
# `curl -X POST http://127.0.0.1:9000/reload` (no hace falta reiniciar).

apps:
  - name: mi-api                              # identificador y nombre del proyecto compose
    repo: jeremialcala/mi-api                 # owner/repo exacto en GitHub
    branch: main                              # unica rama desplegable
    event: workflow_run                       # workflow_run (recomendado) | push
    workflow: build                           # nombre del workflow que debe haber pasado
    project_dir: /srv/apps/mi-api             # donde vive el docker-compose.yml
    compose_file: docker-compose.yml
    image: ghcr.io/jeremialcala/mi-api        # solo informativo, expuesto como $IMAGE
    tag_template: "sha-{short_sha}"           # debe coincidir con el tag que publica Actions
    services: []                              # vacio = pull de todos los servicios
    health_url: http://127.0.0.1:8080/health  # sin esto no hay verificacion ni rollback fiable
    health_timeout: 90
    health_interval: 3
    rollback: true                            # al fallar el health, vuelve al tag anterior
    command_timeout: 600

  # Segundo ejemplo: despliegue directo por push, sin build previa en Actions.
  # Util para un sitio estatico o una app que se construye en el propio servidor.
  # - name: web
  #   repo: jeremialcala/web
  #   branch: main
  #   event: push
  #   project_dir: /srv/apps/web
  #   image: ghcr.io/jeremialcala/web
  #   health_url: http://127.0.0.1:8081/
