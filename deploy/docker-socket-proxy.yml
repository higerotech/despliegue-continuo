# Proxy de la API de Docker con superficie recortada (ADR-0005).
#
# Se despliega en /srv/infra/socket-proxy/ y es el UNICO contenedor que ve
# /var/run/docker.sock. El receptor habla con el por TCP en loopback, de modo
# que su usuario NO pertenece al grupo docker.
#
# Verificado: 'docker compose pull', 'up -d' y el recreado con otro tag
# (rollback) funcionan a traves de este proxy; 'docker exec' y 'docker system'
# devuelven 403.
#
# Honestidad sobre el alcance: POST + CONTAINERS son imprescindibles para
# desplegar, y con ellos aun se puede crear un contenedor privilegiado. Esto
# recorta la superficie y da un punto unico de auditoria, pero la equivalencia
# a root solo desaparece con Docker rootless. Ver docs/02-design/threat-model.md.

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: cd-socket-proxy
    restart: unless-stopped
    # NO poner `read_only: true`: el entrypoint de esta imagen genera su
    # /usr/local/etc/haproxy/haproxy.cfg a partir de un .template que vive en
    # ESE MISMO directorio, asi que con la raiz de solo lectura entra en bucle
    # de reinicio ("can't create haproxy.cfg: Read-only file system") y un
    # tmpfs encima ocultaria la plantilla. El endurecimiento real de este
    # contenedor esta en otra parte: socket montado :ro, puerto solo en
    # loopback, sin privilegios nuevos y superficie de API recortada.
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Solo loopback: nunca 0.0.0.0. Un 2375 accesible desde la red es
      # equivalente a regalar root del host.
      - "127.0.0.1:2375:2375"
    environment:
      LOG_LEVEL: info

      # --- Concedido: lo minimo que necesita 'docker compose' ---
      PING: 1
      VERSION: 1
      INFO: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      DISTRIBUTION: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1

      # --- Denegado explicitamente ---
      EXEC: 0        # sin shells dentro de contenedores ajenos
      AUTH: 0
      BUILD: 0       # el build ocurre en Actions, nunca en el servidor
      COMMIT: 0
      CONFIGS: 0
      SECRETS: 0     # sin lectura de secretos de Docker
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      SESSION: 0
      SYSTEM: 0      # sin prune ni df remoto
      EVENTS: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
